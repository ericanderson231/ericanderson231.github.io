<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0b6bcb"/>
  <!-- "EA" drawn as shapes so it stays centered regardless of font. Letters span x 14-50, y 21-43 before the 1.12x scale about the center. -->
  <g fill="#ffffff" transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <!-- E -->
    <rect x="14" y="21" width="4.5" height="22"/>
    <rect x="14" y="21" width="14" height="4.5"/>
    <rect x="14" y="29.75" width="12" height="4.5"/>
    <rect x="14" y="38.5" width="14" height="4.5"/>
    <!-- A -->
    <polygon points="32,43 38.5,21 43.5,21 50,43 44.8,43 41,30.1 37.2,43"/>
    <rect x="38" y="34.5" width="6" height="4"/>
  </g>
</svg>
